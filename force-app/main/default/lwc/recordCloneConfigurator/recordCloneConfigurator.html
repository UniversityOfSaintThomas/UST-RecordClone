  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <span
              class="slds-truncate"
              title="Record Clone Configuration Helper"
              >Record Clone Configuration Helper</span
            >
          </h2>
        </div>
      </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <div class="slds-is-relative">
        <template if:true={isInvalidObjectName}>
          <div
            class="
              slds-scoped-notification slds-media slds-media_center
              slds-theme_error
            "
            role="alert"
          >
            <div class="slds-media__figure">
              <lightning-icon
                icon-name="utility:error"
                size="x-small"
                variant="inverse"
                alternative-text="Error"
              ></lightning-icon>
            </div>
            <div class="slds-media__body">
              <p>
                Invalid sObject. Check the name in the component properties.
              </p>
            </div>
          </div>
        </template>
        <template if:false={isInvalidObjectName}>
          <template if:true={hasObjectName}>
            <h3 class="slds-text-heading_small slds-m-bottom_small">
              Child objects related to {objectName}
            </h3>
            <div
              class="slds-scrollable_y c-relationship-list"
              role="region"
              tabindex="0"
              aria-label={childrenTableLabel}
            >
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered"
              >
                <thead>
                  <tr class="slds-line-height_reset">
                    <th scope="col">
                      <div class="slds-truncate" title="Relationship name">
                        Relationship name
                      </div>
                    </th>
                    <th scope="col">
                      <div class="slds-truncate" title="Child object">
                        Child object
                      </div>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={childrenList} for:item="child">
                    <tr key={child.name}>
                      <th scope="row" data-label="Relationship name">
                        <div class="slds-truncate" title={child.name}>
                          {child.name}
                        </div>
                      </th>
                      <td data-label="Child object">
                        <div class="slds-truncate" title={child.label}>
                          {child.label}
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="slds-m-top_medium">
              <lightning-textarea
                label="All child relationship names"
                value={childrenListStr}
                read-only
                field-level-help="Copy the names you want into the Child relationship names property of the Record Clone component."
              ></lightning-textarea>
            </div>
          </template>
          <template if:false={hasObjectName}>
            <div class="slds-p-vertical_large">
              <lightning-spinner
                size="small"
                alternative-text="Initializing"
              ></lightning-spinner>
            </div>
          </template>
        </template>
      </div>
    </div>
  </article>
</template>
